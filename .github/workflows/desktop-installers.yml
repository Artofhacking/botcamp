name: Desktop installers

on:
  push:
    branches:
      - cursor/ds-bot-0-2-2-284f
    paths:
      - .github/workflows/desktop-installers.yml

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix client
      - name: Build the Windows installer
        working-directory: client
        env:
          CI: "true"
        run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: botcamp-windows-x64
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix client
      - name: Build the Mac disk image
        working-directory: client
        env:
          CI: "true"
        run: npm run build:mac -- --target ${{ matrix.target }} --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: botcamp-mac-${{ matrix.target }}
          path: client/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
