name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: dist:mac-smoke
            artifact: mac
          - os: windows-latest
            script: dist:win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout BotCamp (patches)
        uses: actions/checkout@v4
        with: { path: botcamp }

      - name: Checkout DSH Desktop upstream
        uses: actions/checkout@v4
        with:
          repository: anywhere-labs/dsh-desktop
          path: dsh-desktop
          submodules: recursive

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Apply BotCamp branding
        run: node botcamp/desktop/apply.mjs dsh-desktop
        env:
          BOTCAMP_DESKTOP_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || '2.0.49' }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: dsh-desktop
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          YARN_NETWORK_CONCURRENCY: 8

      - name: Align workspace package copies
        run: node botcamp/desktop/fix-payload.mjs dsh-desktop

      - name: Build
        working-directory: dsh-desktop
        run: yarn workspace dsh-desktop-next ${{ matrix.script }}

      - name: Apply BotCamp app icon
        if: matrix.artifact == 'mac'
        shell: bash
        run: |
          APP=$(find dsh-desktop/dsh-desktop-next/dist -maxdepth 5 -name 'BotCamp.app' -print -quit)
          if [ -z "$APP" ]; then echo 'BotCamp.app not found'; exit 1; fi
          node botcamp/desktop/fix-app-icon.mjs "$APP"

      - name: Zip macOS app
        if: matrix.artifact == 'mac'
        shell: bash
        run: |
          cd dsh-desktop/dsh-desktop-next/dist/mac-smoke/mac-universal 2>/dev/null || cd dsh-desktop/dsh-desktop-next/dist
          APP=$(ls -d *.app | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP" "BotCamp-${GITHUB_REF_NAME}-universal.zip"

      - name: Install coscmd
        run: python -m pip install --quiet coscmd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: botcamp-${{ matrix.artifact }}
          path: |
            dsh-desktop/dsh-desktop-next/dist/**/*.app
            dsh-desktop/dsh-desktop-next/dist/**/*.zip
            dsh-desktop/dsh-desktop-next/dist/**/*.exe
            dsh-desktop/dsh-desktop-next/dist/**/*.dmg
          if-no-files-found: warn
