name: desktop-unsigned

# 手动构建桌面端安装包，产物在 Actions 的 Artifacts 里。
# macOS 没有开发者证书，改用临时签名盖住整个应用，下载后可在系统设置里允许。
# Windows 仍不签名。macOS 包只包含 Apple 芯片（arm64），不再提供 Intel / universal slice。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号覆盖（留空用 apps/desktop/package.json 里的）
        required: false
        default: ""
      platform:
        description: 只构建一个系统（windows 或 mac，留空为全部）
        required: false
        default: ""
      publish:
        description: 上传到下载目录并更新 latest.json（需要 COS_BUCKET / COS_REGION 变量）
        required: false
        type: boolean
        default: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          PLATFORM: ${{ inputs.platform }}
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The update feed must match main. An installer built from any other branch drifts
          # from what main ships, and the next build from main silently drops its changes.
          if [ "$PUBLISH" = "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Publishing is allowed only from main (this run is $REF). Merge to main first, or build without publish."
            exit 1
          fi
          mac='{"os":"macos-26","target":"--mac","arch":"--arm64","artifact":"botcamp-macos","platform":"mac"}'
          windows='{"os":"windows-latest","target":"--win","arch":"--x64","artifact":"botcamp-windows","platform":"windows"}'
          case "$PLATFORM" in
            mac) matrix="[$mac]" ;;
            windows) matrix="[$windows]" ;;
            "") matrix="[$mac,$windows]" ;;
            *) echo "platform must be mac, windows, or empty" >&2; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    env:
      # 没有证书：让 electron-builder 直接出未签名包，别去找钥匙串里的身份。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the database client for desktop compilation
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo

      - name: Build renderer and Electron main process
        run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build
        env:
          RAKAZO_API_ORIGIN: https://botcamp.aigc.sx.cn

      - name: Package
        shell: bash
        run: |
          set -eo pipefail
          args=(${{ matrix.target }} ${{ matrix.arch }} --publish never)
          # "-" is ad-hoc signing: it seals the app without a paid certificate.
          if [ "${{ matrix.artifact }}" = "botcamp-macos" ]; then
            args+=(-c.mac.identity=-)
          fi
          if [ -n "${{ inputs.version }}" ]; then
            args+=(-c.extraMetadata.version="${{ inputs.version }}")
          fi
          pnpm --filter @rakazo/desktop exec electron-builder "${args[@]}"

      - name: Verify the macOS app is Apple silicon only
        if: matrix.artifact == 'botcamp-macos'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/out -maxdepth 3 -name 'BotCamp.app' -print -quit)
          test -n "$app"
          binary="$app/Contents/MacOS/BotCamp"
          lipo "$binary" -verify_arch arm64
          if lipo "$binary" -verify_arch x86_64 2>/dev/null; then
            echo "::error::$app contains an Intel slice"
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          if ! grep -q 'Sealed Resources version=' <<<"$signature"; then
            echo "::error::$app signature does not seal the bundle"
            exit 1
          fi
          if grep -q 'linker-signed' <<<"$signature"; then
            echo "::error::$app is only linker-signed"
            exit 1
          fi

      - name: List artifacts
        shell: bash
        run: ls -lh apps/desktop/out || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
            apps/desktop/out/*.msi
            apps/desktop/out/*.AppImage
            apps/desktop/out/latest*.yml
            apps/desktop/out/*.blockmap

      # Handing the artifact over by hand is where a release stops matching its feed: the
      # installers land but latest-mac.yml still names the old version, or the other way round.
      - name: Publish to the update feed
        if: inputs.publish == true
        shell: bash
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(node -p "require('./apps/desktop/package.json').version")
          fi
          case "${{ matrix.platform }}" in
            mac) target=mac ;;
            windows) target=win ;;
            *) echo "::error::unknown platform ${{ matrix.platform }}"; exit 1 ;;
          esac
          # The runner's Homebrew Python refuses packages outside a virtualenv (PEP 668).
          # Windows puts the venv binaries in Scripts, macOS and Linux in bin.
          python3 -m venv "$RUNNER_TEMP/publish-venv"
          if [ -x "$RUNNER_TEMP/publish-venv/bin/python" ]; then
            py="$RUNNER_TEMP/publish-venv/bin/python"
          else
            py="$RUNNER_TEMP/publish-venv/Scripts/python.exe"
          fi
          "$py" -m pip install --quiet cos-python-sdk-v5
          "$py" scripts/publish-desktop.py \
            --out apps/desktop/out \
            --platform "$target" \
            --version "$version"
