name: desktop-unsigned

# 手动构建桌面端安装包，产物在 Actions 的 Artifacts 里。
# macOS 没有开发者证书，改用临时签名盖住整个应用，下载后可在系统设置里允许。
# Windows 仍不签名。macOS 包只包含 Apple 芯片（arm64），不再提供 Intel / universal slice。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号覆盖（留空用 apps/desktop/package.json 里的）
        required: false
        default: ""
      platform:
        description: 只构建一个系统（windows 或 mac，留空为全部）
        required: false
        default: ""
      publish:
        description: 上传到下载目录并更新 latest.json（需要 COS_BUCKET / COS_REGION 变量）
        required: false
        type: boolean
        default: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          mac='{"os":"macos-14","target":"--mac","arch":"--arm64","artifact":"botcamp-macos","platform":"mac"}'
          windows='{"os":"windows-latest","target":"--win","arch":"--x64","artifact":"botcamp-windows","platform":"windows"}'
          case "$PLATFORM" in
            mac) matrix="[$mac]" ;;
            windows) matrix="[$windows]" ;;
            "") matrix="[$mac,$windows]" ;;
            *) echo "platform must be mac, windows, or empty" >&2; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.select.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    env:
      # 没有证书：让 electron-builder 直接出未签名包，别去找钥匙串里的身份。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the database client for desktop compilation
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo

      - name: Build renderer and Electron main process
        run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build
        env:
          RAKAZO_API_ORIGIN: https://botcamp.aigc.sx.cn

      - name: Package
        shell: bash
        run: |
          set -eo pipefail
          args=(${{ matrix.target }} ${{ matrix.arch }} --publish never)
          # "-" is ad-hoc signing: it seals the app without a paid certificate.
          if [ "${{ matrix.artifact }}" = "botcamp-macos" ]; then
            args+=(-c.mac.identity=-)
          fi
          if [ -n "${{ inputs.version }}" ]; then
            args+=(-c.extraMetadata.version="${{ inputs.version }}")
          fi
          pnpm --filter @rakazo/desktop exec electron-builder "${args[@]}"

      - name: Verify the macOS app is Apple silicon only
        if: matrix.artifact == 'botcamp-macos'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/out -maxdepth 3 -name 'BotCamp.app' -print -quit)
          test -n "$app"
          binary="$app/Contents/MacOS/BotCamp"
          lipo "$binary" -verify_arch arm64
          if lipo "$binary" -verify_arch x86_64 2>/dev/null; then
            echo "::error::$app contains an Intel slice"
            exit 1
          fi
          codesign --verify --deep --strict "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          if ! grep -q 'Sealed Resources version=' <<<"$signature"; then
            echo "::error::$app signature does not seal the bundle"
            exit 1
          fi
          if grep -q 'linker-signed' <<<"$signature"; then
            echo "::error::$app is only linker-signed"
            exit 1
          fi

      - name: List artifacts
        shell: bash
        run: ls -lh apps/desktop/out || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
            apps/desktop/out/*.msi
            apps/desktop/out/*.AppImage
            apps/desktop/out/latest*.yml
            apps/desktop/out/*.blockmap

      # Handing the artifact over by hand is where a release stops matching its feed: the
      # installers land but latest-mac.yml still names the old version, or the other way round.
      - name: Join the tailnet
        if: inputs.publish == true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.PRODUCTION_SSH_HOST }}

      - name: Configure the download host identity
        if: inputs.publish == true
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/rakazo-production"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rakazo-production" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/rakazo-production" >/dev/null

      - name: Publish to the download host
        if: inputs.publish == true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DOWNLOAD_DIR: ${{ vars.DESKTOP_DOWNLOAD_DIR }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$DOWNLOAD_DIR"
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(node -p "require('./apps/desktop/package.json').version")
          fi
          case "${{ matrix.platform }}" in
            mac) target=mac ;;
            windows) target=win ;;
            *) echo "::error::unknown platform ${{ matrix.platform }}"; exit 1 ;;
          esac
          ssh_options="ssh -F /dev/null -i $HOME/.ssh/rakazo-production -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          $ssh_options "$SSH_USER@$SSH_HOST" "mkdir -p '$DOWNLOAD_DIR'"
          node scripts/publish-desktop.mjs \
            --out apps/desktop/out \
            --platform "$target" \
            --version "$version" \
            --remote "$SSH_USER@$SSH_HOST:$DOWNLOAD_DIR" \
            --ssh "$ssh_options"
