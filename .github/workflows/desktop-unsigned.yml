name: desktop-unsigned

# 手动构建桌面端安装包：macOS 与 Windows 都不签名，产物在 Actions 的 Artifacts 里。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号覆盖（留空用 apps/desktop/package.json 里的）
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
            artifact: botcamp-macos
          - os: windows-latest
            target: --win
            artifact: botcamp-windows
    runs-on: ${{ matrix.os }}
    env:
      # 没有证书：让 electron-builder 直接出未签名包，别去找钥匙串里的身份。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the database client for desktop compilation
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://rakazo:rakazo@127.0.0.1:5433/rakazo

      - name: Build renderer and Electron main process
        run: pnpm --filter @rakazo/web build && pnpm --filter @rakazo/desktop build
        env:
          RAKAZO_API_ORIGIN: https://botcamp.aigc.sx.cn

      - name: Package (unsigned)
        shell: bash
        run: |
          set -eo pipefail
          args=(${{ matrix.target }} --x64 --publish never)
          if [ -n "${{ inputs.version }}" ]; then
            args+=(-c.extraMetadata.version="${{ inputs.version }}")
          fi
          pnpm --filter @rakazo/desktop exec electron-builder "${args[@]}"

      - name: List artifacts
        shell: bash
        run: ls -lh apps/desktop/out || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/out/*.dmg
            apps/desktop/out/*.zip
            apps/desktop/out/*.exe
            apps/desktop/out/*.msi
            apps/desktop/out/*.AppImage
