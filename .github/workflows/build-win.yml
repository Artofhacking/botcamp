name: build-win

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version
        required: false
        default: 2.0.49

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout BotCamp (patches)
        uses: actions/checkout@v4
        with: { path: botcamp }

      - name: Checkout DSH Desktop upstream
        uses: actions/checkout@v4
        with:
          repository: anywhere-labs/dsh-desktop
          path: dsh-desktop
          submodules: recursive

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            dsh-desktop/.yarn/cache
            dsh-desktop/node_modules
          key: win-${{ hashFiles('botcamp/desktop/**', 'botcamp/.github/workflows/build-win.yml') }}

      - name: Apply BotCamp branding
        working-directory: dsh-desktop
        run: node ../botcamp/desktop/apply.mjs .
        env:
          BOTCAMP_DESKTOP_VERSION: ${{ inputs.version }}

      - name: Enable corepack
        working-directory: dsh-desktop
        run: corepack enable

      - name: Install dependencies
        working-directory: dsh-desktop
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          YARN_NETWORK_CONCURRENCY: 8

      - name: Align workspace package copies
        run: node botcamp/desktop/fix-payload.mjs dsh-desktop

      - name: Build Windows installer
        working-directory: dsh-desktop
        continue-on-error: true
        run: yarn workspace dsh-desktop-next dist:win

      - name: Install COS SDK
        run: npm install --no-save --prefix botcamp cos-nodejs-sdk-v5

      - name: Publish installer to COS
        if: always()
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        shell: bash
        run: |
          EXE=$(find dsh-desktop/dsh-desktop-next/dist -maxdepth 1 -name '*Setup.exe' -print -quit)
          test -n "$EXE"
          node botcamp/desktop/publish-cos.mjs "$EXE" "botcamp/updates/win/BotCamp-${{ inputs.version }}-x64-Setup.exe"

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botcamp-win-${{ inputs.version }}
          path: dsh-desktop/dsh-desktop-next/dist/*Setup.exe
          if-no-files-found: warn
