name: desktop-macos-screenshot
on:
  push:
    branches: [main]
    paths: &desktop-setup-paths
      - ".github/workflows/desktop-macos-screenshot.yml"
      - "apps/desktop/package.json"
      - "apps/desktop/assets/**"
      - "packages/ui-tokens/assets/**"
      - "apps/desktop/scripts/copy-static.mjs"
      - "apps/desktop/src/setup*"
      - "apps/desktop/src/window-options.ts"
      - "packages/contracts/src/desktop.ts"
  pull_request:
    paths: *desktop-setup-paths

permissions:
  contents: read

concurrency:
  group: desktop-macos-screenshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshot:
    name: macOS package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @botcamp/desktop build
      - name: Verify the packaged Mac icon
        run: |
          pnpm --filter @botcamp/web build
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm --filter @botcamp/desktop exec electron-builder --mac --dir --publish never -c.mac.identity=null -c.mac.notarize=false
          app=apps/desktop/out/mac-arm64/BotCamp.app/Contents
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Info.plist")" = icon.icns
          iconutil -c iconset "$app/Resources/icon.icns" -o "$RUNNER_TEMP/icon.iconset"
          sips -s format png "$RUNNER_TEMP/icon.iconset/icon_128x128@2x.png" --out "$RUNNER_TEMP/icon-decoded.png"
          test -s "$RUNNER_TEMP/icon-decoded.png"
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"
