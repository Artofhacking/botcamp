name: build-mac

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version
        required: false
        default: 2.0.48

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout BotCamp (patches)
        uses: actions/checkout@v4
        with: { path: botcamp }

      - name: Checkout DSH Desktop upstream
        uses: actions/checkout@v4
        with:
          repository: anywhere-labs/dsh-desktop
          path: dsh-desktop
          submodules: recursive

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            dsh-desktop/.yarn/cache
            dsh-desktop/node_modules
          key: mac-${{ hashFiles('botcamp/desktop/**', 'botcamp/.github/workflows/build-mac.yml') }}

      - name: Apply BotCamp branding
        run: node botcamp/desktop/apply.mjs dsh-desktop
        env:
          BOTCAMP_DESKTOP_VERSION: ${{ inputs.version }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: dsh-desktop
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          YARN_NETWORK_CONCURRENCY: 8

      - name: Align workspace package copies
        run: node botcamp/desktop/fix-payload.mjs dsh-desktop

      - name: Build
        working-directory: dsh-desktop
        run: yarn workspace dsh-desktop-next dist:mac-smoke

      - name: Apply BotCamp app icon
        shell: bash
        run: |
          APP=$(find dsh-desktop/dsh-desktop-next/dist -maxdepth 5 -name 'BotCamp.app' -print -quit)
          test -n "$APP"
          node botcamp/desktop/fix-app-icon.mjs "$APP"

      - name: Install COS SDK
        run: npm install --no-save --prefix botcamp cos-nodejs-sdk-v5

      - name: Publish DMG to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        shell: bash
        run: |
          DMG=$(find dsh-desktop/dsh-desktop-next/dist -name '*.dmg' -print -quit)
          test -n "$DMG"
          NAME=$(basename "$DMG")
          node botcamp/desktop/publish-cos.mjs "$DMG" "botcamp/updates/mac/$NAME"
          node botcamp/desktop/publish-cos.mjs "$DMG" "botcamp/updates/mac/BotCamp-latest.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: botcamp-mac-dmg
          path: dsh-desktop/dsh-desktop-next/dist/**/*.dmg
          if-no-files-found: error
