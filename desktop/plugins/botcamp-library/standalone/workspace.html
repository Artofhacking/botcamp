<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8">
<title>BotCamp 文档库</title>
<link rel="stylesheet" href="./vditor/dist/index.css">
<style>
  :root {
    --bg: #fbfaf8;
    --panel: #f4f1eb;
    --ink: #37352f;
    --muted: #8b857c;
    --line: #e8e3da;
    --accent: #d95d3f;
    --hover: #ebe6dd;
    --white: #fffefa;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  #app { display: flex; height: 100vh; overflow: hidden; }
  #sidebar {
    width: 282px; flex: 0 0 282px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    min-height: 0; transition: transform .2s ease;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 18px 16px 10px; }
  .brand-mark { font-size: 21px; }
  .brand-name { font-weight: 700; letter-spacing: .2px; }
  .brand-sub { color: var(--muted); font-size: 11px; margin-top: -2px; }
  .tree-section-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 10px 8px 4px 14px; }
  .tree-section { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .tree-section-add { flex: none; width: 22px; height: 22px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font: 16px/1 system-ui; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .tree-section-add:hover { background: var(--hover); color: var(--ink); }
  .tree-node { margin: 1px 8px; border-radius: 7px; }
  .tree-node:hover, .tree-node:focus-within { background: var(--hover); }
  .tree-node.active { background: #ece8df; }
  .tree-row { display: flex; align-items: center; gap: 6px; min-height: 30px; padding: 2px 6px 2px 2px; border-radius: 7px; cursor: default; user-select: none; }
  .tree-row.doc-row { cursor: pointer; }
  .tree-twisty { flex: none; width: 16px; height: 22px; border: 0; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; padding: 0; }
  .tree-spacer { flex: none; width: 16px; }
  .tree-icon { flex: none; width: 18px; text-align: center; font-size: 15px; }
  .tree-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--ink); }
  .tree-actions { display: flex; flex: none; align-items: center; gap: 1px; opacity: 0; transition: opacity .12s; }
  .tree-node:hover .tree-actions, .tree-node:focus-within .tree-actions { opacity: 1; }
  .tree-act { width: 22px; height: 22px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); font: 15px/1 system-ui; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .tree-act:hover { background: rgba(0,0,0,.08); color: var(--ink); }
  .tree-rename { flex: 1; min-width: 0; height: 24px; padding: 0 5px; border: 1px solid var(--accent); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; font-size: 13px; outline: none; }
  .ctx-menu { position: fixed; z-index: 200; min-width: 150px; padding: 5px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); box-shadow: 0 12px 32px rgba(0,0,0,.16); }
  .ctx-menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; white-space: nowrap; }
  .ctx-menu button:hover { background: var(--hover); }
  .ctx-info { padding: 2px 10px; color: var(--muted); font-size: 11px; line-height: 1.35; white-space: nowrap; }
  .ctx-info:last-child { padding-bottom: 5px; }
  .ctx-sep { height: 1px; margin: 3px 4px; background: var(--line); }
  #media-view { position: absolute; inset: 0; overflow: auto; padding: 22px 26px; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  #media-view img, #media-view video { display: block; max-width: 100%; max-height: calc(100vh - 96px); margin: 0; border-radius: 8px; background: #000; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
  .media-caption { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); max-width: 720px; color: var(--muted); font-size: 12px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mobile-menu { display: none; }
  @media (max-width: 760px) {
    .tree-actions { opacity: 1; }
    .mobile-menu { display: flex; position: fixed; z-index: 50; left: 10px; top: 10px; width: 34px; height: 34px; align-items: center; justify-content: center; padding: 0; background: rgba(255,255,255,.9); }
  }
  .btn {
    border: 1px solid var(--line); background: var(--white); color: var(--ink);
    border-radius: 7px; padding: 6px 10px; cursor: pointer; line-height: 1.2;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { opacity: .88; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.danger { color: #b53b2d; }
  .btn:disabled { opacity: .45; cursor: default; }
  #search {
    margin: 0 14px 8px; width: calc(100% - 28px); border: 1px solid var(--line);
    background: var(--white); border-radius: 7px; padding: 7px 9px; outline: none;
  }
  #search:focus { border-color: #c9c1b4; }
  #tree { overflow: auto; padding: 0 8px 20px; flex: 1; min-height: 0; }
  .group-label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 9px 5px; }
  .file-row {
    display: flex; align-items: baseline; gap: 7px; width: 100%; text-align: left;
    border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer;
    color: var(--ink);
  }
  .file-row:hover { background: var(--hover); }
  .file-row.active { background: #e7dfd3; }
  .file-icon { flex: 0 0 18px; text-align: center; }
  .file-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { color: var(--muted); font-size: 11px; }
  .file-row .file-meta { display: none; }
  .file-row:hover .file-meta { display: inline; }
  .media-row { color: var(--muted); font-size: 12px; padding-left: 34px; }
  .tree-empty { color: var(--muted); font-size: 12px; padding: 16px 10px; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  body.embed-editor #sidebar, body.embed-editor #sidebar-mask, body.embed-editor #menu { display: none !important; }
  body.embed-editor #main { width: 100%; }
  .docs-sidebar-toggle { display: none; }
  body.embed-right #sidebar { position: relative; z-index: 20; inset: auto; width: 210px; flex: 0 0 210px; transform: none; box-shadow: none; border-right: 1px solid var(--line); transition: width .18s ease, flex-basis .18s ease; overflow: hidden; }
  body.embed-right #sidebar.collapsed { width: 44px; flex-basis: 44px; }
  body.embed-right #sidebar.collapsed > :not(.docs-sidebar-toggle) { display: none !important; }
  body.embed-right .docs-sidebar-toggle { display: flex; position: absolute; top: 10px; right: 8px; z-index: 5; width: 26px; height: 26px; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--muted); font: 16px/1 system-ui; cursor: pointer; }
  body.embed-right #sidebar.collapsed .docs-sidebar-toggle { right: 8px; }
  body.embed-right #sidebar-mask, body.embed-right #menu { display: none !important; }
  body.embed-right #main { width: 100%; padding-top: 0; }
  body.embed-right .brand { padding-right: 42px; }


  #topbar {
    height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line); padding: 0 12px; background: rgba(251,250,248,.94);
    backdrop-filter: blur(8px);
  }
  #menu { display: none; }
  #doc-path {
    font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; min-width: 0;
  }
  #status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status.dirty { color: var(--accent); }
  #editor-wrap { flex: 1; min-height: 0; position: relative; }
  #editor { height: 100%; }
  #empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); padding: 24px;
  }
  #empty .card { max-width: 420px; }
  #empty h2 { color: var(--ink); font-size: 21px; margin: 0 0 8px; }
  #empty p { margin: 0 0 18px; line-height: 1.8; }
  .toast {
    position: fixed; right: 18px; bottom: 18px; background: #37352f; color: #fff;
    padding: 9px 14px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none;
    transform: translateY(6px); transition: .2s ease; z-index: 80;
  }
  .toast.show { opacity: 1; transform: none; }
  #sidebar-mask { display: none; }
  .vditor { border: 0 !important; border-radius: 0 !important; background: transparent !important; }
  .vditor-toolbar { border-bottom: 1px solid var(--line) !important; background: var(--bg) !important; padding-left: 10px !important; }
  .vditor-content { background: var(--bg) !important; }
  .vditor-reset { max-width: none; width: 100%; margin: 0; padding-left: 24px; padding-right: 24px; }
  .vditor-toolbar [data-type="edit-mode"], .vditor-toolbar [data-type="preview"] { display: none !important; }
  .vditor-sv { display: none !important; }
  @media (max-width: 760px) {
    #sidebar { position: fixed; z-index: 60; inset: 0 auto 0 0; transform: translateX(-100%); box-shadow: 12px 0 30px rgba(0,0,0,.12); }
    body.nav-open #sidebar { transform: none; }
    #sidebar-mask { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.22); opacity: 0; pointer-events: none; transition: .2s; }
    body.nav-open #sidebar-mask { opacity: 1; pointer-events: auto; }
    #menu { display: inline-block; }
    #topbar { gap: 4px; padding: 0 8px; }
    #topbar .btn { padding: 5px 7px; }
    #status { display: none; }
    #image, #rename, #delete { display: none; }
    .vditor-toolbar { overflow-x: auto; }
  }
</style>
</head>
<body>
<div id="sidebar-mask"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark">📚</span>
      <div><div class="brand-name">文档库</div><div class="brand-sub">Markdown · 本地文件</div></div>
    </div>
    <button type="button" id="docs-sidebar-toggle" class="docs-sidebar-toggle" title="收起文档树" aria-label="收起文档树" aria-expanded="true">«</button>
    <input id="search" placeholder="搜索标题或路径…" autocomplete="off">
    <div id="tree"></div>
  </aside>
  <main id="main">
    <button class="btn ghost mobile-menu" id="menu" title="文件">☰</button>
    <input id="image-input" type="file" accept="image/*" hidden>
    <div id="editor-wrap">
      <div id="empty">
        <div class="card">
          <h2>写一篇终稿</h2>
          <p>左边是 <code>~/BotCamp/library</code> 里的文档。新建、编辑、保存都直接写回 Markdown 文件，不做版本管理。</p>
          <button class="btn primary" id="empty-new">＋ 新建第一篇</button>
        </div>
      </div>
      <div id="editor" hidden></div>
      <div id="media-view" hidden>
        <div class="media-caption" id="media-caption"></div>
        <img id="media-image" hidden alt="">
        <video id="media-video" controls playsinline hidden></video>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="ctx-menu" id="ctx-menu" role="menu" hidden></div>
<script src="./vditor/dist/index.min.js"></script>
<script src="./workspace.js"></script>
</body>
</html>
