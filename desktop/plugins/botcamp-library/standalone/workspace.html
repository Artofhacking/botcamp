<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf8">
<title>BotCamp 文档库</title>
<link rel="stylesheet" href="./vditor/dist/index.css">
<style>
  :root {
    --bg: #fbfaf8;
    --panel: #f4f1eb;
    --ink: #37352f;
    --muted: #8b857c;
    --line: #e8e3da;
    --accent: #d95d3f;
    --hover: #ebe6dd;
    --white: #fffefa;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  #app { display: flex; height: 100vh; overflow: hidden; }
  #sidebar {
    width: 282px; flex: 0 0 282px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    min-height: 0; transition: transform .2s ease;
  }
  .brand { display: flex; align-items: center; gap: 9px; padding: 18px 16px 10px; }
  .brand-mark { font-size: 21px; }
  .brand-name { font-weight: 700; letter-spacing: .2px; }
  .brand-sub { color: var(--muted); font-size: 11px; margin-top: -2px; }
  .side-actions { display: flex; gap: 7px; padding: 4px 14px 10px; }
  .btn {
    border: 1px solid var(--line); background: var(--white); color: var(--ink);
    border-radius: 7px; padding: 6px 10px; cursor: pointer; line-height: 1.2;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.primary:hover { opacity: .88; }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.danger { color: #b53b2d; }
  .btn:disabled { opacity: .45; cursor: default; }
  #search {
    margin: 0 14px 8px; width: calc(100% - 28px); border: 1px solid var(--line);
    background: var(--white); border-radius: 7px; padding: 7px 9px; outline: none;
  }
  #search:focus { border-color: #c9c1b4; }
  #tree { overflow: auto; padding: 0 8px 20px; flex: 1; min-height: 0; }
  .group-label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 12px 9px 5px; }
  .file-row {
    display: flex; align-items: baseline; gap: 7px; width: 100%; text-align: left;
    border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; cursor: pointer;
    color: var(--ink);
  }
  .file-row:hover { background: var(--hover); }
  .file-row.active { background: #e7dfd3; }
  .file-icon { flex: 0 0 18px; text-align: center; }
  .file-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { color: var(--muted); font-size: 11px; }
  .file-row .file-meta { display: none; }
  .file-row:hover .file-meta { display: inline; }
  .media-row { color: var(--muted); font-size: 12px; padding-left: 34px; }
  .tree-empty { color: var(--muted); font-size: 12px; padding: 16px 10px; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  #topbar {
    height: 52px; flex: 0 0 52px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line); padding: 0 12px; background: rgba(251,250,248,.94);
    backdrop-filter: blur(8px);
  }
  #menu { display: none; }
  #doc-path {
    font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; min-width: 0;
  }
  #status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #status.dirty { color: var(--accent); }
  #editor-wrap { flex: 1; min-height: 0; position: relative; }
  #editor { height: 100%; }
  #empty {
    height: 100%; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); padding: 24px;
  }
  #empty .card { max-width: 420px; }
  #empty h2 { color: var(--ink); font-size: 21px; margin: 0 0 8px; }
  #empty p { margin: 0 0 18px; line-height: 1.8; }
  .toast {
    position: fixed; right: 18px; bottom: 18px; background: #37352f; color: #fff;
    padding: 9px 14px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none;
    transform: translateY(6px); transition: .2s ease; z-index: 80;
  }
  .toast.show { opacity: 1; transform: none; }
  #sidebar-mask { display: none; }
  .vditor { border: 0 !important; border-radius: 0 !important; background: transparent !important; }
  .vditor-toolbar { border-bottom: 1px solid var(--line) !important; background: var(--bg) !important; padding-left: 10px !important; }
  .vditor-content { background: var(--bg) !important; }
  .vditor-reset { max-width: 760px; margin: 0 auto; }
  @media (max-width: 760px) {
    #sidebar { position: fixed; z-index: 60; inset: 0 auto 0 0; transform: translateX(-100%); box-shadow: 12px 0 30px rgba(0,0,0,.12); }
    body.nav-open #sidebar { transform: none; }
    #sidebar-mask { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.22); opacity: 0; pointer-events: none; transition: .2s; }
    body.nav-open #sidebar-mask { opacity: 1; pointer-events: auto; }
    #menu { display: inline-block; }
    #topbar { gap: 4px; padding: 0 8px; }
    #topbar .btn { padding: 5px 7px; }
    #status { display: none; }
    #image, #rename, #delete { display: none; }
    .vditor-toolbar { overflow-x: auto; }
  }
</style>
</head>
<body>
<div id="sidebar-mask"></div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark">📚</span>
      <div><div class="brand-name">文档库</div><div class="brand-sub">Markdown · 本地文件</div></div>
    </div>
    <div class="side-actions">
      <button class="btn primary" id="new-doc">＋ 新建文档</button>
      <button class="btn" id="refresh" title="刷新">↻</button>
    </div>
    <input id="search" placeholder="搜索标题或路径…" autocomplete="off">
    <div id="tree"></div>
  </aside>
  <main id="main">
    <header id="topbar">
      <button class="btn ghost" id="menu" title="文件">☰</button>
      <div id="doc-path">未选择文档</div>
      <span id="status"></span>
      <button class="btn" id="image" disabled>图片</button>
      <button class="btn" id="save" disabled>保存</button>
      <button class="btn" id="rename" disabled>重命名</button>
      <input id="image-input" type="file" accept="image/*" hidden>
      <button class="btn danger" id="delete" disabled>删除</button>
    </header>
    <div id="editor-wrap">
      <div id="empty">
        <div class="card">
          <h2>写一篇终稿</h2>
          <p>左边是 <code>~/BotCamp/library</code> 里的文档。新建、编辑、保存都直接写回 Markdown 文件，不做版本管理。</p>
          <button class="btn primary" id="empty-new">＋ 新建第一篇</button>
        </div>
      </div>
      <div id="editor" hidden></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="./vditor/dist/index.min.js"></script>
<script src="./workspace.js"></script>
</body>
</html>
