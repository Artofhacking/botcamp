<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The computer locale is C.UTF-8. Debian binds Noto CJK only when the page
  language is Chinese, and that face is a CFF collection Chromium often cannot
  draw. WenQuanYi is TrueType and is the generic family for every language,
  so Han is not an empty box. This file is ordered after 70-fonts-noto-cjk.conf.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>WenQuanYi Zen Hei</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>WenQuanYi Zen Hei Mono</string>
    </edit>
  </match>
</fontconfig>
