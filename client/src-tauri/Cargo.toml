[package]
name = "botcamp"
version = "0.1.0"
description = "BotCamp desktop and mobile shell"
authors = ["BotCamp"]
edition = "2021"
rust-version = "1.77"

# Windows is the first install target. macOS, Android, and iOS keep this crate:
# the library already exposes the mobile entry point.

[lib]
name = "botcamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
