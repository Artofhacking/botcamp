        error_page 401 = @desk_login;
        error_page 403 = @desk_login;
        error_page 503 = @desk_offline;
        rewrite ^/desk/d4/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18768;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location ~ ^/desk/d5/(?<rest>.*)$ {
        auth_request /botcamp/api/relay/check/d5;
        error_page 401 = @desk_login;
        error_page 403 = @desk_login;
        error_page 503 = @desk_offline;
        rewrite ^/desk/d5/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18769;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
