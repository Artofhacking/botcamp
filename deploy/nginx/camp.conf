    }

    location ~ ^/desk/d6/(?<rest>.*)$ {
        auth_request /botcamp/api/relay/check/d6;
        error_page 401 = @desk_login;
        error_page 403 = @desk_login;
        error_page 503 = @desk_offline;
        rewrite ^/desk/d6/(.*)$ /$1 break;
