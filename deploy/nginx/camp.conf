# camp.aigc.sx.cn
# 这个域名只提供内核 API。浏览器界面只在 https://botcamp.demox.site/ 。
# 不要在这里返回或反代 HTML，也不要把 / 或任何路径 302/303 到 Demox
# （页面若再跳回本域名，浏览器会 ERR_TOO_MANY_REDIRECTS）。
# 只把 /api/ 反代到 127.0.0.1:3080（含 /api/bot 与 /api/bot/feed）。其它路径是纯文本 404。

server {
    listen 443 ssl;
    http2 on;
    server_name camp.aigc.sx.cn;

    ssl_certificate /etc/letsencrypt/live/camp.aigc.sx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camp.aigc.sx.cn/privkey.pem;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        default_type text/plain;
        charset utf-8;
        return 404 "API only\n";
    }
}
