        proxy_buffering off;
    }


    location @desk_offline {
        default_type application/json;
        return 503 "{\"error\":\"device offline\"}";
    }

    # BotCamp: accounts, login and metered model gateway (127.0.0.1:8790).
    location ^~ /botcamp/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_buffering off;
        proxy_cache off;
    }

    # Upgrade / Connection 留给内核在 /api/ 上的 websocket。$connection_upgrade 在 http 上下文里定义。
    location /api/ {
        default_type application/json;
        charset utf-8;
        if ($cookie_botcamp_session = "") {
            return 401 '{"ok":false,"error":{"code":"auth/required","message":"请先登录"}}\n';
        }

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # 精确匹配优先于下面的前缀 /。浏览器没有交换头，所以仍是 404。
    location = / {
        include /etc/nginx/snippets/dsh-camp-exchange.conf;
        error_page 418 = @dsh_ticket;
        if ($botcamp_exchange = 1) {
            return 418;
        }
        default_type text/plain;
        charset utf-8;
        return 404 "camp.aigc.sx.cn is API-only. Open https://botcamp.demox.site/\n";
    }

    location @dsh_ticket {
        # dsh-camp-token.conf 把启动令牌放进 $dsh_upstream（无 dsh-auth cookie 时是 /?token=…）。
        # 不把这个变量接上的话，内核只看到 GET /，会回 401。
        include /etc/nginx/snippets/dsh-camp-token.conf;
        proxy_pass http://127.0.0.1:3080$dsh_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    location / {
        default_type text/plain;
        charset utf-8;
        return 404 "camp.aigc.sx.cn is API-only. Open https://botcamp.demox.site/\n";
    }
}
