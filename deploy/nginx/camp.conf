# camp.aigc.sx.cn
# 这个域名不再提供网站。不要返回 HTML，不要把浏览器送进内核页面，
# 也不要把 Demox 的首页或静态资源代理过来，更不要跳去 botcamp.demox.site。
# 人打开的地址只有 https://botcamp.demox.site/ 。
# 只有 /api/（含 /api/bot、/api/bot/feed，以及内核在 /api/ 上的 websocket 升级）
# 转到本机 dsh 127.0.0.1:3080。其它路径返回一行纯文本 404。
# 邮箱会话不在 nginx 上检查。Demox 云函数和本地 Vite 会先核对 botcamp_session，
# 没有会话直接 401，请求到不了内核。内核自己的 dsh-auth 只放在这两个代理进程里。

server {
    listen 443 ssl;
    http2 on;
    server_name camp.aigc.sx.cn;

    ssl_certificate /etc/letsencrypt/live/camp.aigc.sx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camp.aigc.sx.cn/privkey.pem;

    client_max_body_size 50m;

    # Upgrade / Connection 留给内核在 /api/ 上的 websocket。$connection_upgrade 在 http 上下文里定义。
    location /api/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        default_type text/plain;
        charset utf-8;
        return 404 "camp.aigc.sx.cn is API-only. Open https://botcamp.demox.site/\n";
    }
}

# 内核今天在 GET / 上用 303 签发 dsh-auth，不会在 /api 上签发。
# 上面让 / 直接 404 之后，云函数就不能再靠访问 / 拿到这张 cookie。
# reload 之后如果代发内核得到 401，不要把网站或 Demox 首页加回来。
# 只给「还没有 dsh-auth 的 GET /」一条到 127.0.0.1:3080 的内部交换：
# 不返回 HTML，不跟随跳转把浏览器送进内核页面，Set-Cookie 也不能交给浏览器。
