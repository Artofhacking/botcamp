# camp.aigc.sx.cn
# 这个域名只提供内核 API，不是浏览器入口。页面只在 https://botcamp.demox.site/ 。
# 不要在这里返回 HTML，不要把浏览器送进内核页面，也不要把 Demox 的首页或静态资源代理过来。
# 只有 /api/（含 /api/bot、/api/bot/feed，以及内核在 /api/ 上的 websocket 升级）转到 127.0.0.1:3080。
# 其它路径返回一行纯文本。

server {
    listen 443 ssl;
    http2 on;
    server_name camp.aigc.sx.cn;

    ssl_certificate /etc/letsencrypt/live/camp.aigc.sx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camp.aigc.sx.cn/privkey.pem;

    client_max_body_size 50m;

    # Upgrade / Connection 留给内核在 /api/ 上的 websocket。$connection_upgrade 在 http 上下文里定义。
    location /api/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        default_type text/plain;
        charset utf-8;
        return 404 "camp.aigc.sx.cn is API-only. Open https://botcamp.demox.site/\n";
    }
}
