# camp.aigc.sx.cn
# 这个域名不提供网站：不返回 HTML，不托管静态资源，不把浏览器转去 Demox，
# 也不再把「/」交给内核，避免 303 到 ./ 的循环。
# 页面只在 https://botcamp.demox.site/ 。
# 只有 /api/（含 /api/bot、/api/bot/feed，以及内核在 /api/ 上的 websocket 升级）
# 可以到达 127.0.0.1:3080。这些 API 必须带上和 Demox 网关相同的多用户会话 cookie：botcamp_session。
# 没有这个 cookie 时，在进 dsh 之前返回 401。网关先校验会话，才会带上它来调用内核。
# dsh-auth 仍只放在网关进程里，不要写进日志，也不要回给浏览器。
# 内核只在 GET / 上用启动令牌换 dsh-auth，不会在 /api 上签发。
# 浏览器打开 / 仍然是纯文本 404。网关换票时带上 x-botcamp-exchange，
# 值写在服务器上的 /etc/nginx/snippets/dsh-camp-exchange.conf，不进 git。
# 对上之后才把这一次 GET / 交给 127.0.0.1:3080，并沿用原来的 dsh-camp-token.conf。

server {
    listen 443 ssl;
    http2 on;
    server_name camp.aigc.sx.cn;

    ssl_certificate /etc/letsencrypt/live/camp.aigc.sx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camp.aigc.sx.cn/privkey.pem;

    client_max_body_size 50m;

    # Upgrade / Connection 留给内核在 /api/ 上的 websocket。$connection_upgrade 在 http 上下文里定义。
    location /api/ {
        default_type application/json;
        charset utf-8;
        if ($cookie_botcamp_session = "") {
            return 401 '{"ok":false,"error":{"code":"auth/required","message":"请先登录"}}\n';
        }

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # 精确匹配优先于下面的前缀 /。浏览器没有交换头，所以仍是 404。
    location = / {
        include /etc/nginx/snippets/dsh-camp-exchange.conf;
        error_page 418 = @dsh_ticket;
        if ($botcamp_exchange = 1) {
            return 418;
        }
        default_type text/plain;
        charset utf-8;
        return 404 "camp.aigc.sx.cn is API-only. Open https://botcamp.demox.site/\n";
    }

    location @dsh_ticket {
        # dsh-camp-token.conf 把启动令牌放进 $dsh_upstream（无 dsh-auth cookie 时是 /?token=…）。
        # 不把这个变量接上的话，内核只看到 GET /，会回 401。
        include /etc/nginx/snippets/dsh-camp-token.conf;
        proxy_pass http://127.0.0.1:3080$dsh_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    location / {
        default_type text/plain;
        charset utf-8;
        return 404 "camp.aigc.sx.cn is API-only. Open https://botcamp.demox.site/\n";
    }
}
