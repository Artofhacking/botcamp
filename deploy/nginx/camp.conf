# camp.aigc.sx.cn
# 这个域名不提供网站：不返回 HTML，不托管静态资源，不把浏览器转去 Demox，
# 也不再把「/」交给内核，避免 303 到 ./ 的循环。
# 页面只在 https://botcamp.demox.site/ 。
# 只有 /api/（含 /api/bot、/api/bot/feed，以及内核在 /api/ 上的 websocket 升级）
# 可以到达 127.0.0.1:3080。这些 API 必须带上和 Demox 网关相同的多用户会话 cookie：botcamp_session。
# 没有这个 cookie 时，在进 dsh 之前返回 401。网关先校验会话，才会带上它来调用内核。
# dsh-auth 仍只放在网关进程里，不要写进日志，也不要回给浏览器。
# 内核只在 GET / 上用启动令牌换 dsh-auth，不会在 /api 上签发。
# 浏览器打开 / 仍然是纯文本 404。网关换票时带上 x-botcamp-exchange，
# 值写在服务器上的 /etc/nginx/snippets/dsh-camp-exchange.conf，不进 git。
# 对上之后才把这一次 GET / 交给 127.0.0.1:3080，并沿用原来的 dsh-camp-token.conf。

server {
    listen 443 ssl;
    http2 on;
    server_name camp.aigc.sx.cn;

    ssl_certificate /etc/letsencrypt/live/camp.aigc.sx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camp.aigc.sx.cn/privkey.pem;

    client_max_body_size 50m;

    # Mobile PWA (Next static export). Next emits root-absolute /_next assets,
    # so both the page and its content-hashed assets need a location.
    location ^~ /_next/ {
        alias /opt/botcamp/mobile/_next/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /m/ {
        alias /opt/botcamp/mobile/;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # BotCamp client update feed (electron-updater, generic provider).
    location ^~ /botcamp/updates/ {
        alias /opt/botcamp/updates/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/octet-stream;
        location ~* \.ya?ml$ {
            default_type text/yaml;
        }
    }

    # Desktop relay: phone/web reach the Mac-hosted DSH through the reverse tunnel.
    location ^~ /botcamp/api/relay/check/ {
        internal;
        proxy_pass http://127.0.0.1:8790;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @desk_login {
        return 302 https://camp.aigc.sx.cn/botcamp/relay;
    }

    location = /desk/ {
        return 302 https://camp.aigc.sx.cn/botcamp/relay;
    }

    location ~ ^/desk/d1/(?<rest>.*)$ {
        auth_request /botcamp/api/relay/check/d1;
        error_page 401 = @desk_login;
        error_page 403 = @desk_login;
        error_page 503 = @desk_offline;
        rewrite ^/desk/d1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location ~ ^/desk/d2/(?<rest>.*)$ {
        auth_request /botcamp/api/relay/check/d2;
        error_page 401 = @desk_login;
        error_page 403 = @desk_login;
        error_page 503 = @desk_offline;
        rewrite ^/desk/d2/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8765;
