server {
    listen 443 ssl;
    http2 on;
    server_name camp.aigc.sx.cn;

    ssl_certificate /etc/letsencrypt/live/camp.aigc.sx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camp.aigc.sx.cn/privkey.pem;

    client_max_body_size 50m;

    # Frontend static assets on Demox (botcamp-dsh-frontend / IVBLF9PE)
    location ^~ /assets/ {
        resolver 119.29.29.29 223.5.5.5 ipv6=off valid=30s;
        resolver_timeout 2s;
        set $demox_origin ivblf9pe.demox.site;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ivblf9pe.demox.site;
        proxy_set_header Host ivblf9pe.demox.site;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_hide_header Set-Cookie;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        proxy_pass https://$demox_origin;
    }

    location = /favicon.svg {
        resolver 119.29.29.29 223.5.5.5 ipv6=off valid=30s;
        set $demox_origin ivblf9pe.demox.site;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ivblf9pe.demox.site;
        proxy_set_header Host ivblf9pe.demox.site;
        proxy_pass https://$demox_origin;
    }

    location = /favicon-dark.svg {
        resolver 119.29.29.29 223.5.5.5 ipv6=off valid=30s;
        set $demox_origin ivblf9pe.demox.site;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ivblf9pe.demox.site;
        proxy_set_header Host ivblf9pe.demox.site;
        proxy_pass https://$demox_origin;
    }

    location = /manifest.webmanifest {
        resolver 119.29.29.29 223.5.5.5 ipv6=off valid=30s;
        set $demox_origin ivblf9pe.demox.site;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name ivblf9pe.demox.site;
        proxy_set_header Host ivblf9pe.demox.site;
        proxy_pass https://$demox_origin;
    }

    location = / {
        include /etc/nginx/snippets/dsh-camp-token.conf;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
