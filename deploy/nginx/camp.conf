# camp.aigc.sx.cn
# 浏览器入口仍是这个域名：dsh 拒绝跨站 /api（Origin 与 Host 不一致会 403）。
# Demox botcamp 站点上放的是 DeepSeek Bot 自己的页面（app/ui），不是 Harness 壳。
# /api（含 /api/bot 与 /api/bot/feed）转到本机 dsh；ds-bot 插件要装在这个内核上。
# 已登录（带 dsh-auth-* cookie）且没有 ?token= 的 / 返回 Demox 上的 index.html。
# 未登录或带 ?token= 的请求继续交给 dsh，完成启动令牌换 cookie。

server {
    listen 443 ssl;
    http2 on;
    server_name camp.aigc.sx.cn;

    ssl_certificate /etc/letsencrypt/live/camp.aigc.sx.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camp.aigc.sx.cn/privkey.pem;

    client_max_body_size 50m;

    location = / {
        include /etc/nginx/snippets/dsh-camp-token.conf;
        error_page 418 = @botcamp_index;
        if ($arg_token = "") {
            set $botcamp_gate A;
        }
        if ($http_cookie ~* "dsh-auth-") {
            set $botcamp_gate "${botcamp_gate}B";
        }
        if ($botcamp_gate = AB) {
            return 418;
        }

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location @botcamp_index {
        resolver 119.29.29.29 223.5.5.5 ipv6=off valid=30s;
        resolver_timeout 2s;
        set $demox_origin botcamp.demox.site;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name botcamp.demox.site;
        proxy_set_header Host botcamp.demox.site;
        proxy_pass https://$demox_origin/index.html;
    }

    location ^~ /assets/ {
        resolver 119.29.29.29 223.5.5.5 ipv6=off valid=30s;
        resolver_timeout 2s;
        set $demox_origin botcamp.demox.site;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name botcamp.demox.site;
        proxy_set_header Host botcamp.demox.site;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Set-Cookie;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        proxy_pass https://$demox_origin;
    }

    location = /favicon.svg {
        resolver 119.29.29.29 223.5.5.5 ipv6=off valid=30s;
        set $demox_origin botcamp.demox.site;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name botcamp.demox.site;
        proxy_set_header Host botcamp.demox.site;
        proxy_pass https://$demox_origin;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location /plugins/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
