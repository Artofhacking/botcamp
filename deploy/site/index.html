<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BotCamp</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #14161a;
         font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { width: min(92vw, 380px); text-align: center; }
  h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -.4px; }
  .version { margin: 0 0 22px; color: #667085; font-size: 13px; min-height: 20px; }
  a { display: block; padding: 13px 18px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; }
  a.primary { background: #4d6bfe; color: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
  a.primary:hover { background: #3f5cf0; }
  a.ghost { margin-top: 10px; background: #fff; color: #14161a; border: 1px solid #e6e8ee; }
  a.ghost:hover { border-color: #cfd4e0; }

  .account { position: fixed; top: 18px; right: 22px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #667085; z-index: 10; }
  .account a { display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 8px; text-decoration: none; color: inherit; font-weight: 500; }
  .account a:hover { background: #fff; border-color: #e6e8ee; }
  .account .console { border: 1px solid #e6e8ee; background: #fff; }
  .account .email { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account .logout { border: 0; background: transparent; color: #667085; font: inherit; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .account .logout:hover { background: #fff; color: #14161a; }
</style>
</head>
<body>
<div class="account" id="account"></div>
<main>
  <h1>BotCamp</h1>
  <p class="version" id="version">正在获取最新版本…</p>
  <a class="primary" id="download" href="https://dl.demox.site/botcamp/updates/mac/BotCamp-2.0.49.dmg">下载 macOS 版</a>
  <a class="ghost" id="windows" href="https://dl.demox.site/botcamp/updates/win/BotCamp-2.0.49-x64-Setup.exe">下载 Windows 版</a>
  <a class="ghost" id="android" href="https://dl.demox.site/botcamp/updates/android/BotCamp-2.0.49.apk">下载 Android 版</a>
</main>
<script>
  const fallback = {
    version: '2.0.45',
    url: 'https://dl.demox.site/botcamp/updates/mac/BotCamp-2.0.49.dmg'
  }
  const versionNode = document.getElementById('version')
  const downloadNode = document.getElementById('download')
  const windowsNode = document.getElementById('windows')
  const androidNode = document.getElementById('android')
  const accountNode = document.getElementById('account')
  const email = localStorage.getItem('bc_email') || ''
  const token = localStorage.getItem('bc_token') || ''
  if (token && email) {
    accountNode.innerHTML = '<a class="console" href="/desk/">控制台</a><span class="email">' + email.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) + '</span><button class="logout" id="logout" type="button">退出登录</button>'
    document.getElementById('logout').onclick = () => { try { localStorage.removeItem('bc_token'); localStorage.removeItem('bc_admin'); localStorage.removeItem('bc_admin_token'); localStorage.removeItem('bc_email'); } catch (e) {} location.replace('/login/'); };
  } else {
    accountNode.innerHTML = '<a class="console" href="/login/">登录</a>'
  }
  const render = (release) => {
    const version = release && release.version ? String(release.version) : fallback.version
    const url = release && release.url
      ? String(release.url)
      : 'https://camp.aigc.sx.cn/botcamp/updates/mac/BotCamp-' + version + '.dmg'
    versionNode.textContent = '最新版本 ' + version
    downloadNode.textContent = '下载 macOS 版 ' + version
    downloadNode.href = url
    const windowsUrl = release && release.windowsUrl
      ? String(release.windowsUrl)
      : 'https://camp.aigc.sx.cn/botcamp/updates/win/BotCamp-' + version + '-x64-Setup.exe'
    windowsNode.textContent = '下载 Windows 版 ' + version
    windowsNode.href = windowsUrl
    if (androidNode) androidNode.textContent = '下载 Android 版'
  }
  fetch('https://camp.aigc.sx.cn/botcamp/updates/win/version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.json()).then(w => { if (w && w.version) { windowsNode.textContent = '下载 Windows 版 ' + w.version; if (w.url) windowsNode.href = w.url } }).catch(() => {})
  fetch('https://camp.aigc.sx.cn/botcamp/updates/mac/version.json?t=' + Date.now(), { cache: 'no-store' })
    .then((response) => { if (!response.ok) throw new Error('HTTP ' + response.status); return response.json() })
    .then(render)
    .catch(() => render(fallback))
</script>
</body>
</html>
